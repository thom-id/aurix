<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BlazeTopia - Growtopia Private Server">
<meta name="theme-color" content="#ff6b00">

<title>🔥 BlazeTopia</title>

<link rel="icon" href="favicon.png">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#0f0f0f,#1b1b1b,#ff4500);
color:#fff;
min-height:100vh;
display:flex;
flex-direction:column;
}

.container{
width:100%;
max-width:800px;
margin:auto;
padding:40px 20px;
text-align:center;
}

.logo{
width:220px;
display:block;
margin:0 auto 20px;
filter:drop-shadow(0 0 15px rgba(255,120,0,.5));
}

h1{
font-size:52px;
color:#ff6b00;
margin-bottom:15px;
text-shadow:0 0 15px rgba(255,120,0,.6);
}

.card{
background:#222;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,120,0,.3);
margin-top:20px;
}

.card h2{
font-size:30px;
margin-bottom:15px;
}

.card p{
font-size:18px;
color:#ddd;
line-height:1.6;
margin-bottom:25px;
}

.btn{
display:block;
width:100%;
padding:15px;
background:#5865F2;
color:#fff;
text-decoration:none;
border-radius:50px;
font-size:20px;
font-weight:bold;
margin-bottom:25px;
transition:.3s;
}

.btn:hover{
background:#6d78ff;
}

.section{
background:#2d2d2d;
padding:18px;
border-radius:15px;
margin-bottom:18px;
text-align:left;
}

.section h3{
margin-bottom:10px;
color:#ff8c2b;
}

.copy-box{
display:flex;
gap:10px;
}

.copy-box input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#111;
color:#fff;
outline:none;
}

.copy-box button{
padding:12px 18px;
border:none;
background:#ff6b00;
color:#fff;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.copy-box button:hover{
background:#ff8128;
}

.windows p{
margin-bottom:8px;
}

.windows button{
margin-top:10px;
width:100%;
padding:12px;
background:#ff6b00;
border:none;
border-radius:10px;
color:#fff;
font-weight:bold;
cursor:pointer;
}

footer{
margin-top:30px;
padding:20px;
background:#111;
text-align:center;
color:#aaa;
}

@media(max-width:600px){

.logo{
width:170px;
}

h1{
font-size:38px;
}

.card{
padding:20px;
}

.copy-box{
flex-direction:column;
}

.copy-box button{
width:100%;
}

}
</style></head>

<body>

<div class="container">

<img src="logo.png" class="logo" alt="BlazeTopia Logo">

<h1>🔥 BlazeTopia</h1>

<div class="card">

<h2>Welcome to BlazeTopia!</h2>

<p>
The best Growtopia Private Server with exciting features and a friendly community.
</p>

<a class="btn"
href="https://discord.gg/AWRsZfm32"
target="_blank">
💬 Join Discord
</a>

<div class="section">

<h3>🤖 Android</h3>

<div class="copy-box">
<input
type="text"
id="android"
readonly
value="https://gtpshosting.web.id/raw/BlazeTopia">

<button onclick="copyText('android')">
Copy
</button>
</div>

</div>

<div class="section">

<h3>🍎 iOS</h3>

<div class="copy-box">
<input
type="text"
id="ios"
readonly
value="https://gtpshosting.web.id/ios/BlazeTopia">

<button onclick="copyText('ios')">
Copy
</button>
</div>

</div>

<div class="section windows">

<h3>🖥 Windows</h3>

<p><strong>IP Address:</strong> 149.202.58.185</p>
<p><strong>Hostname:</strong> www.growtopia1.com</p>
<p><strong>Hostname:</strong> www.growtopia2.com</p>

<button onclick="copyWindows()">
Copy
</button>

</div>

</div>

</div>

<footer>
© 2026 BlazeTopia. All Rights Reserved.
</footer>

<script>

function copyText(id){
const value=document.getElementById(id).value;
navigator.clipboard.writeText(value);
alert("Copied!");
}

function copyWindows(){
navigator.clipboard.writeText(
`149.202.58.185
www.growtopia1.com
149.202.58.185
www.growtopia2.com`
);
alert("Copied!");
}

</script>

</body>
</html>
