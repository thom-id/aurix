<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BlazeTopia - Growtopia Private Server dengan pengalaman bermain terbaik.">
<meta name="theme-color" content="#ff6b00">

<title>🔥 BlazeTopia</title>

<link rel="icon" href="favicon.png" type="image/png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f0f0f,#1b1b1b,#ff4500);
    color:#fff;
    display:flex;
    flex-direction:column;
    text-align:center;
}

header{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:60px 20px;
}

.container{
    width:100%;
    max-width:750px;
}

h1{
    font-size:60px;
    color:#ff6b00;
    text-shadow:0 0 20px rgba(255,120,0,.8);
    margin-bottom:20px;
}

.card{
    background:#222;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,100,0,.4);
    animation:fadeUp .8s ease;
}

.card h2{
    margin-bottom:15px;
    font-size:32px;
}

.card p{
    color:#ddd;
    font-size:20px;
    line-height:1.6;
    margin-bottom:35px;
}

.features{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.box{
    background:#333;
    padding:25px;
    border-radius:16px;
    transition:.3s;
}

.box:hover{
    transform:translateY(-5px);
    box-shadow:0 0 20px rgba(255,120,0,.45);
}

.btn{
    display:block;
    width:100%;
    padding:16px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
    font-size:20px;
    color:white;
    transition:.3s;
}

.discord{
    background:#5865F2;
}

.discord:hover{
    background:#6d78ff;
    transform:scale(1.03);
}

.play{
    background:#ff6b00;
}

.play:hover{
    background:#ff8128;
    transform:scale(1.03);
}

footer{
    background:#111;
    color:#aaa;
    padding:20px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    h1{
        font-size:46px;
    }

    .card{
        padding:25px;
    }

    .card h2{
        font-size:26px;
    }

    .card p{
        font-size:18px;
    }

    .btn{
        font-size:18px;
    }

}

@media(max-width:480px){

    h1{
        font-size:36px;
    }

    .card{
        padding:20px;
    }

    .card h2{
        font-size:22px;
    }

    .card p{
        font-size:16px;
    }

}
</style>

</head>
<body>

<header>

<div class="container">

<h1>🔥 BlazeTopia</h1>

<div class="card">

<h2>Welcome to BlazeTopia!</h2>

<p>
Welcome to the BlazeTopia Community, a Growtopia Private Server
that delivers the best gaming experience with exciting features,
friendly players, and nonstop adventures.
</p>

<div class="features">

<div class="box">
<a class="btn discord"
href="https://discord.gg/AWRsZfm32"
target="_blank"
rel="noopener noreferrer">
💬 Join Discord
</a>
</div>

<div class="box">
<a class="btn play"
href="https://gtpshosting.web.id/how-to-play/Blazetopia"
target="_blank"
rel="noopener noreferrer">
🎮 How To Play
</a>
</div>

</div>

</div>

</div>

</header>

<footer>
© 2026 BlazeTopia. All Rights Reserved.
</footer>

</body>
</html>
