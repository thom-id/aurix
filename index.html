<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlazeTopia</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#0f0f0f,#1b1b1b,#ff4500);
color:white;
text-align:center;
}

header{
padding:80px 20px;
}

h1{
font-size:60px;
color:#ff6b00;
text-shadow:0 0 20px orange;
}

p{
margin-top:15px;
font-size:20px;
color:#ddd;
}

.btn{
display:inline-block;
margin:15px;
padding:15px 35px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
transition:.3s;
}

.download{
background:#ff4500;
color:white;
}

.discord{
background:#5865F2;
color:white;
}

.btn:hover{
transform:scale(1.08);
}

section{
padding:60px 20px;
}

.card{
background:#222;
max-width:900px;
margin:auto;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,100,0,.4);
}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-top:30px;
}

.box{
background:#333;
padding:20px;
border-radius:15px;
}

footer{
padding:30px;
background:#111;
margin-top:50px;
color:#aaa;
}
</style>

</head>
<body>

<header>
<h1>🔥 Blazetopia</h1>

<section>
<div class="card">
<h2>Welcome Blazetopia!</h2>
<p>Welcome to the Blazetopia community, a Growtopia private server with the best gaming experience ever.</p>
<div class="features">

<div class="box">
<a class="btn discord" href="https://discord.gg/AWRsZfm32">💬 Join Discord</a>
</header>

<div class="box">
<a class="btn discord" href="https://gtpshosting.web.id/how-to-play/Blazetopia">🎮 How To Play</a>
</header>
