<title>BlazeTopia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:
    linear-gradient(rgba(5,10,30,.85),rgba(0,30,60,.9)),
    url("background.jpg");

    background-size:cover;
    background-position:center;

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
}

.container{
    width:100%;
    max-width:500px;

    background:rgba(10,25,60,.65);

    border:2px solid rgba(0,200,255,.35);
    border-radius:25px;

    padding:30px;

    backdrop-filter:blur(10px);

    box-shadow:0 0 25px rgba(0,200,255,.25);
}


.logo{
    display:block;

    width:130px;

    margin:0 auto 15px;

    filter:drop-shadow(0 0 15px cyan);
}


.title{
    text-align:center;

    font-size:30px;

    color:#00d9ff;

    text-shadow:0 0 10px cyan;

    margin-bottom:25px;
}


h0{
    display:block;

    font-size:18px;

    margin-bottom:8px;

    color:white;
}


.card{

    background:rgba(0,50,90,.8);

    padding:15px;

    border-radius:15px;

    margin-bottom:15px;

    border:1px solid #00bfff;

    cursor:pointer;

    transition:.2s;

}


.card:hover{

    transform:scale(1.02);

    box-shadow:0 0 15px cyan;

}


.card p{

    color:#00ffff;

    line-height:1.5;

}


.discord{

    text-align:center;

    padding:25px;

}


.footer{

    text-align:center;

    margin-top:15px;

    color:#ccc;

    font-size:12px;

}

</style>

</head>


<body>


<div class="container">

<script>

function copyText(text){

navigator.clipboard.writeText(text);


const notification=document.createElement("div");

notification.innerText="Copied!";


notification.style.position="fixed";

notification.style.bottom="20px";

notification.style.left="50%";

notification.style.transform="translateX(-50%)";

notification.style.background="#00bfff";

notification.style.color="white";

notification.style.padding="10px 20px";

notification.style.borderRadius="10px";

notification.style.fontWeight="bold";

notification.style.boxShadow="0 0 15px cyan";

notification.style.zIndex="9999";


document.body.appendChild(notification);


setTimeout(()=>{

notification.remove();

},2000);


}

</script>
