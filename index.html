<!DOCTYPE html>  
<html lang="id">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>AURIX - Growtopia Private Server</title>  
  <meta property="og:title" content="AURIX - Growtopia Private Server">  
  <meta property="og:description" content="Join AURIX and play on Android, iOS & Windows.">  
  <meta property="og:image" content="https://cdn.phototourl.com/free/2026-08-16-9d9ada9b-8322-4f89-9a0c-84b4fd7af0bc.png">  
  <meta name="theme-color" content="#F5D76E">  
  <style>  
    * {  
      margin: 0;  
      padding: 0;  
      box-sizing: border-box;  
      font-family: 'Segoe UI', Arial, sans-serif;  
      scroll-behavior: smooth;  
    }  

    body {  
      background: #1a1200;  
      color: #fff;  
      overflow-x: hidden;  
      min-height: 100vh;  
    }  

    body::before {  
      content: "";  
      position: fixed;  
      inset: 0;  
      background:  
        linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.85)),  
        url("https://cdn.phototourl.com/free/2026-08-16-9d9ada9b-8322-4f89-9a0c-84b4fd7af0bc.png");  
      background-size: 100% auto;  
      background-position: top center;  
      background-repeat: no-repeat;  
      background-attachment: fixed;  
      z-index: -2;  
    }  

    body::after {  
      content: "";  
      position: fixed;  
      inset: 0;  
      background: radial-gradient(circle at top, rgba(255, 215, 0, 0.15), rgba(10, 8, 0, 0.95));  
      z-index: -1;  
    }  

    .container {  
      width: 92%;  
      max-width: 470px;  
      margin: 280px auto 40px;  
    }  

    /* HERO */  
    .hero {  
      padding: 26px;  
      border-radius: 24px;  
      background: rgba(20, 15, 0, 0.8);  
      backdrop-filter: blur(15px);  
      border: 1px solid rgba(255, 215, 0, 0.4);  
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);  
      text-align: center;  
    }  

    .hero h1 {  
      font-size: 18px;  
      line-height: 1.5;  
      margin-bottom: 15px;  
      white-space: nowrap;  
    }  

    .gradient-text {  
      background: linear-gradient(90deg, #FFE17B, #FFD700, #B8860B);  
      -webkit-background-clip: text;  
      -webkit-text-fill-color: transparent;  
      font-weight: 900;  
      text-shadow: 0px 0px 20px rgba(255, 215, 0, 0.5);  
    }  

    .hero p {  
      font-size: 14px;  
      line-height: 1.7;  
      color: #f5f0da;  
      margin-bottom: 25px;  
    }  

    /* BUTTON - DIUBAH JADI SEJAJAR */  
    .buttons {  
      display: flex;  
      flex-direction: row; /* Membuat tombol sejajar ke samping */  
      gap: 12px;  
      width: 100%;  
    }  

    .btn {  
      flex: 1; /* Membagi lebar tombol jadi sama rata (50% : 50%) */  
      padding: 16px 10px;  
      border: none;  
      border-radius: 18px;  
      color: #1a1200;  
      font-size: 14px;  
      font-weight: 800;  
      cursor: pointer;  
      transition: .25s;  
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);  
      white-space: nowrap;  
    }  

    .btn:hover {  
      transform: translateY(-4px);  
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.7);  
    }  

    .discord {  
      background: linear-gradient(90deg, #FFD700, #FFF3CD);  
    }  

    .play {  
      background: linear-gradient(90deg, #FFF8DC, #D4AF37);  
    }  

    /* SCROLL */  
    .scroll {  
      display: flex;  
      flex-direction: column;  
      align-items: center;  
      justify-content: center;  
      text-align: center;  
      margin: 35px 0;  
      color: #FFE17B;  
    }  

    .arrow {  
      font-size: 30px;  
      animation: down 1.2s infinite;  
      color: #FFD700;  
    }  

    @keyframes down {  
      50% { transform: translateY(8px); }  
    }  

    /* CONTENT */  
    .content {  
      padding: 26px;  
      border-radius: 24px;  
      background: rgba(20, 15, 0, 0.8);  
      backdrop-filter: blur(15px);  
      border: 1px solid rgba(255, 215, 0, 0.3);  
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.1);  
      margin-bottom: 25px;  
    }  

    .title {  
      text-align: center;  
      font-size: 25px;  
      font-weight: 900;  
      margin-bottom: 10px;  
      color: #FFE17B;  
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);  
    }  

    .desc {  
      text-align: center;  
      font-size: 14px;  
      color: #f5f0da;  
      margin-bottom: 30px;  
    }  

    .label {  
      font-size: 15px;  
      font-weight: 700;  
      margin: 15px 0 7px;  
      color: #FFD700;  
    }  

    .card {  
      padding: 15px 18px;  
      margin-bottom: 14px;  
      border-radius: 18px;  
      background: rgba(0, 0, 0, 0.6);  
      border: 1px solid rgba(255, 215, 0, 0.15);  
      cursor: pointer;  
      transition: .25s;  
    }  

    .card:hover {  
      transform: translateY(-3px);  
      border-color: #FFD700;  
      background: rgba(0, 0, 0, 0.8);  
    }  

    .card p {  
      font-size: 13px;  
      line-height: 1.7;  
      color: #FFF8DC;  
    }  

    /* POPUP */  
    .popup {  
      display: none;  
      position: fixed;  
      inset: 0;  
      background: rgba(0,0,0,.85);  
      backdrop-filter: blur(10px);  
      z-index: 9999;  
      align-items: center;  
      justify-content: center;  
    }  

    .popup-box {  
      width: 90%;  
      max-width: 420px;  
      padding: 25px;  
      border-radius: 28px;  
      background: linear-gradient(145deg, #3a2e00, #0f0a00);  
      border: 1px solid rgba(255, 215, 0, 0.8);  
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.6), 0 0 100px rgba(255, 215, 0, 0.2);  
      animation: popupShow .35s ease;  
    }  

    @keyframes popupShow {  
      from { opacity: 0; transform: scale(.75) translateY(50px); }  
      to { opacity: 1; transform: scale(1) translateY(0); }  
    }  

    .popup-box h2 {  
      text-align: center;  
      font-size: 24px;  
      color: #FFD700;  
      margin-bottom: 20px;  
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);  
    }  

    .popup-box input {  
      width: 100%;  
      padding: 14px;  
      margin-bottom: 12px;  
      border-radius: 16px;  
      border: 1px solid rgba(255, 215, 0, 0.4);  
      background: #1a1300;  
      color: white;  
      outline: none;  
    }  

    .popup-box input:focus {  
      border-color: #FFD700;  
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);  
    }  

    .popup-box input::placeholder {  
      color: #bba56e;  
    }  

    .qris {  
      width: 100%;  
      margin-top: 15px;  
      border-radius: 18px;  
      border: 2px solid #FFD700;  
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);  
      cursor: pointer;  
      transition: .3s;  
    }  

    .qris:hover {  
      transform: scale(1.05);  
    }  

    .order-discord {  
      width: 100%;  
      padding: 14px;  
      margin-top: 15px;  
      border: none;  
      border-radius: 18px;  
      background: linear-gradient(90deg, #5865F2, #404EED);  
      color: white;  
      font-size: 15px;  
      font-weight: 900;  
      cursor: pointer;  
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.5);  
    }  

    .buy-btn {  
      width: 100%;  
      padding: 14px;  
      margin-top: 12px;  
      border: none;  
      border-radius: 18px;  
      background: linear-gradient(90deg, #FFD700, #B8860B);  
      color: #1a1200;  
      font-size: 15px;  
      font-weight: 900;  
      cursor: pointer;  
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);  
    }  

    .close-btn {  
      width: 100%;  
      padding: 12px;  
      margin-top: 12px;  
      border: none;  
      border-radius: 15px;  
      background: #3a2e00;  
      color: #e6d59a;  
      cursor: pointer;  
      border: 1px solid rgba(255, 215, 0, 0.2);  
    }  

    .footer {  
      text-align: center;  
      font-size: 14px;  
      color: #D4AF37;  
      margin-top: 20px;  
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);  
    }  
  </style>  
</head>  
<body>  
  <div class="container">  
    <!-- HERO -->  
    <div class="hero">  
      <h1>  
        Welcome to   
        <span class="gradient-text">AURIX Private Server</span>  
      </h1>  
      <p>  
        This is a GTPS that you can play for free, with systems and mechanisms that have been designed as best as possible to produce the best gaming experience.  
      </p>  
      
      <!-- BUTTONS SEJAJAR -->  
      <div class="buttons">  
        <button class="btn discord hhhhh hhhhh hu hgh
        <div class="popup" id="popup">  
    <div class="popup-box">  
      <h2>Complete Purchase</h2>  
      <input id="selectedRole" placeholder="Selected Role" readonly>  
      <input id="growid" placeholder="GrowID Ingame">  
      <input id="discordUser" placeholder="Discord Username">  
      <p style="color: #FFE17B; margin-top: 5px;">QRIS Payment</p>  
      <img class="qris" src="https://fascinating-olive-pybmy8go.edgeone.dev/">  
      <button class="buy-btn" onclick="sendOrder()">Send Order</button>  
      <button class="order-discord" onclick="orderDiscord()">Order via Discord</button>  
      <button class="close-btn" onclick="closeBuy()">Close</button>  
    </div>  
  </div>  

  <script>  
    function showToast() {  
      const t = document.createElement("div");  
      t.innerHTML = "Copied!";  
      Object.assign(t.style, {  
        position: "fixed",  
        left: "50%",  
        bottom: "25px",  
        transform: "translateX(-50%)",  
        background: "#D4AF37",  
        color: "#1a1200",  
        padding: "12px 28px",  
        borderRadius: "14px",  
        fontWeight: "700",  
        zIndex: "9999"  
      });  
      document.body.appendChild(t);  
      setTimeout(() => t.remove(), 1800);  
    }  

    function copyText(text) {  
      navigator.clipboard.writeText(text)  
        .then(showToast)  
        .catch(() => alert("Failed to copy"));  
    }  

    function openBuy(role) {  
      document.getElementById("popup").style.display = "flex";  
      document.getElementById("selectedRole").value = role;  
    }  

    function closeBuy() {  
      document.getElementById("popup").style.display = "none";  
    }  

    function orderDiscord() {  
      let role = document.getElementById("selectedRole").value;  
      let growid = document.getElementById("growid").value;  
      let discord = document.getElementById("discordUser").value;  
      let orderText = "🔥 AURIX Order\n\n" +  
                      "Role : " + role +  
                      "\nGrowID : " + growid +  
                      "\nDiscord : " + discord;  
      navigator.clipboard.writeText(orderText);  
      window.open("https://discord.gg/NPn884u2s", "_blank");  
    }  

    function sendOrder() {  
      let role = document.getElementById("selectedRole").value;  
      let growid = document.getElementById("growid").value;  
      let discord = document.getElementById("discordUser").value;  
      if (growid === "" || discord === "") {  
        alert("Please fill all information!");  
        return;  
      }  
      let order = "🔥 AURIX Order\n\n" +  
                  "Role : " + role +  
                  "\nGrowID : " + growid +  
                  "\nDiscord : " + discord;  
      alert("Order Created!\n\n" + order);  
    }  
  </script>  
</body>  
  </html>
