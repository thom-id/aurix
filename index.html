<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlazeTopia - Growtopia Private Server</title>
<meta property="og:title" content="BlazeTopia - Growtopia Private Server">
<meta property="og:description" content="Join BlazeTopia and play on Android, iOS & Windows.">
<meta property="og:image" content="https://cdn.phototourl.com/free/2026-07-30-11942640-781d-4228-8db8-387799b1bd66.png">
<meta name="theme-color" content="#d60000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#120000;color:#fff;overflow-x:hidden;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.50)),url("https://cdn.phototourl.com/free/2026-07-30-11942640-781d-4228-8db8-387799b1bd66.png");background-size:100% auto;background-position:top center;background-repeat:no-repeat;background-attachment:fixed;z-index:-2}
body::after{content:"";position:fixed;inset:0;background:radial-gradient(circle at top,rgba(255,0,0,.10),rgba(0,0,0,.85));z-index:-1}
.container{width:92%;max-width:470px;margin:280px auto 35px;padding:26px;border-radius:24px;background:rgba(35,0,0,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,70,70,.20);box-shadow:0 0 35px rgba(255,0,0,.15)}
.discord{width:100%;padding:18px;margin-bottom:22px;border:none;border-radius:18px;background:linear-gradient(90deg,#ff2d2d,#b30000);color:#fff;font-size:18px;font-weight:700;cursor:pointer;transition:.25s;box-shadow:0 8px 25px rgba(255,0,0,.30)}
.discord:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(255,0,0,.45)}
.discord:active{transform:scale(.98)}
.label{font-size:15px;font-weight:600;margin:12px 0 6px;color:#fff}
.card{width:100%;padding:14px 18px;margin-bottom:14px;border-radius:18px;background:rgba(25,8,8,.82);border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-2px);border-color:rgba(255,70,70,.4);box-shadow:0 8px 20px rgba(255,0,0,.15)}
.card p{font-size:13px;line-height:1.7;color:#e6d59a;white-space:nowrap;overflow:hidden;text-overflow:clip}
.footer{margin-top:18px;text-align:center;font-size:14px;color:rgba(255,255,255,.70)}
</style>
</head>
<body>
<div class="container">
<button class="discord" onclick="window.open('https://discord.gg/Y9dbApGRv','_blank')">🔥 Discord Community</button>
<div class="label">Android</div>
<div class="card" onclick="copyText('https://gtpshosting.web.id/raw/blazetopia')"><p>https://gtpshosting.web.id/raw/blazetopia</p></div>
<div class="label">iOS</div>
<div class="card" onclick="copyText('https://gtpshosting.web.id/ios/blazetopia')"><p>https://gtpshosting.web.id/ios/blazetopia</p></div>
<div class="label">IP Address For Windows</div>
<div class="card" onclick="copyText('149.202.58.185 www.growtopia1.com&#10;149.202.58.185 www.growtopia2.com')">
<p>149.202.58.185 www.growtopia1.com<br>149.202.58.185 www.growtopia2.com</p></div>
<div class="footer">Enter the Flames. Rule the World.</div>
</div>
<script>
function showToast(){
const t=document.createElement("div");
t.innerHTML="✅ Copied!";
Object.assign(t.style,{position:"fixed",left:"50%",bottom:"25px",transform:"translateX(-50%)",background:"linear-gradient(90deg,#b70000,#ff2d2d)",color:"#fff",padding:"12px 28px",borderRadius:"14px",fontSize:"15px",fontWeight:"700",boxShadow:"0 0 25px rgba(255,0,0,.45)",zIndex:"9999",opacity:"0",transition:".25s"});
document.body.appendChild(t);
setTimeout(()=>t.style.opacity="1",20);
setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),250)},1800);
}
function copyText(text){
navigator.clipboard.writeText(text).then(showToast).catch(()=>alert("Failed to copy."));
}
</script>
</body>
</html>
