<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlazeTopia</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:linear-gradient(135deg,#0f0f0f,#1b1b1b,#ff4500);
color:white;
text-align:center;
}

header{
padding:80px 20px 40px;
}

h1{
font-size:60px;
color:#ff6b00;
text-shadow:0 0 20px orange;
margin-bottom:20px;
}

.card{
background:#222;
max-width:700px;
margin:auto;
padding:35px;
border-radius:20px;
box-shadow:0 0 20px rgba(255,100,0,.4);
}

.card h2{
margin-bottom:15px;
}

.card p{
color:#ddd;
font-size:20px;
margin-bottom:30px;
}

.features{
display:flex;
flex-direction:column;
gap:20px;
}

.box{
background:#333;
padding:25px;
border-radius:16px;
}

.btn{
display:inline-block;
padding:15px 35px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
font-size:20px;
background:#5865F2;
color:white;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

footer{
margin-top:50px;
padding:25px;
background:#111;
color:#aaa;
}
</style>

</head>
<body>

<header>

<h1>🔥 BlazeTopia</h1>

<div class="card">

<h2>Welcome BlazeTopia!</h2>

<p>
Welcome to the BlazeTopia community, a Growtopia private server
with the best gaming experience ever.
</p>

<div class="features">

<div class="box">
<a class="btn" href="https://discord.gg/AWRsZfm32">
💬 Join Discord
</a>
</div>

<div class="box">
<a class="btn" href="https://gtpshosting.web.id/how-to-play/Blazetopia">
🎮 How To Play
</a>
</div>

</div>

</div>

</header>

<footer>
© 2026 BlazeTopia. All Rights Reserved.
</footer>

</body>
</html>
