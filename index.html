<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    padding:20px;

    color:white;

    background:
    linear-gradient(
    180deg,
    rgba(45,0,0,.45) 0%,
    rgba(90,0,0,.70) 35%,
    rgba(130,0,0,.92) 70%,
    rgba(150,0,0,1) 100%

    background-size:100% auto;

    background-position:center top;

    background-repeat:no-repeat;

    background-attachment:fixed;

}

/* MAIN */

.container{

    width:100%;

    max-width:500px;

    margin:260px auto 30px;

    padding:30px 25px;

    border-radius:28px;

    background:
    rgba(85,0,5,.60);

    border:
    2px solid rgba(255,70,70,.30);

    backdrop-filter:
    blur(6px);

    box-shadow:
    0 0 28px rgba(255,0,0,.25);

}

/* DISCORD */

.discord{

    width:100%;

    padding:18px;

    margin-bottom:25px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
    90deg,
    #b80000,
    #ff1010
    );

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

/* LABEL */

.label{

    font-size:15px;

    font-weight:bold;

    margin-top:12px;

    margin-bottom:6px;

}

/* HOST CARD */

.card{

    width:100%;

    padding:12px 20px;

    margin-bottom:12px;

    border-radius:15px;

    background:
    rgba(25,0,7,.80);

    border:
    1px solid rgba(255,75,75,.25);

    cursor:pointer;

    overflow:hidden;

}

.card p{

    color:#d8c88d;

    font-size:14px;

    line-height:1.7;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.footer{

    text-align:center;

    margin-top:15px;

    color:rgba(255,255,255,.65);

    font-size:13px;

<script>

function copyText(text){

navigator.clipboard.writeText(text);

const notification=document.createElement("div");

notification.innerText="Copied!";

notification.style.position="fixed";
notification.style.bottom="20px";
notification.style.left="50%";
notification.style.transform="translateX(-50%)";
notification.style.background="#ff1010";
notification.style.color="white";
notification.style.padding="10px 20px";
notification.style.borderRadius="10px";
notification.style.fontWeight="bold";
notification.style.zIndex="9999";

document.body.appendChild(notification);

setTimeout(()=>{

notification.remove();

},2000);

}

</script>
