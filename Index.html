<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlazeTopia - Growtopia Private Server</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#120000;color:#fff}
.hero{padding:60px 20px;text-align:center;background:linear-gradient(#300,#120000)}
.btn{display:inline-block;margin:8px;padding:14px 22px;border-radius:14px;text-decoration:none;color:#fff;font-weight:bold}
.discord{background:linear-gradient(90deg,#ff3030,#000,#900000)}
.play{background:linear-gradient(90deg,#ff3030,#900000)}
.section{max-width:900px;margin:20px auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:16px}
.card{background:#2a0000;padding:16px;border-radius:16px;border:1px solid #a22}
.price{margin-top:12px;font-weight:bold;color:#ff6666}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero">
<h1>Welcome to <span style="color:#ff4040">BlazeTopia Private Server</span></h1>
<p>Play BlazeTopia on Android, iOS and Windows.</p>
<a class="btn discord" href="https://discord.gg/Y9dbApGRv">Join Discord</a>
<a class="btn play" href="#roles">Price Roles</a>
</div>
<div class="section" id="roles">
<h2>Price Roles</h2>
<div class="grid">
<div class="card"><h3>Reseller</h3><div class="price">Rp 400.000</div></div>
<div class="card"><h3>Middleman</h3><div class="price">Rp 200.000</div></div>
<div class="card"><h3>Unlimited Block</h3><div class="price">Rp 250.000</div></div>
<div class="card"><h3>Super Developer</h3><div class="price">Rp 150.000</div></div>
<div class="card"><h3>Developer</h3><div class="price">Rp 75.000</div></div>
<div class="card"><h3>Moderator</h3><div class="price">Rp 50.000</div></div>
<div class="card"><h3>VIP</h3><div class="price">Rp 25.000</div></div>
</div>
</div>
</body></html>
